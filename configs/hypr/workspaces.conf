# Workspace-to-monitor pinning using monitor descriptions (stable across reboots).
# DP-XX names change between sessions — desc: uses make/model/serial which stays constant.
# NOTE: nwg-displays will overwrite this file if run — re-apply manually after.

workspace=1,monitor:desc:Microstep MAG274Q QD E2 CC2HC24301384,default:true
workspace=2,monitor:desc:Samsung Electric Company S24F350 H4ZK102336,default:true

workspace = special:workflow, on-created-empty:brave-browser --new-window $HOME/.config/hypr/workflow.html
