---
# Enable RPM Fusion free — required for ffmpeg and other multimedia codecs
- name: Enable RPM Fusion free repository
  become: true
  dnf:
    name: "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_distribution_major_version }}.noarch.rpm"
    state: present
    disable_gpg_check: true

- name: Install Hyprland stack and supporting packages
  become: true
  dnf:
    name:
      # Hyprland core (hyprpm is bundled with hyprland package)
      - hyprland
      - hyprlock
      - hypridle
      # Wallpaper daemon and color theming
      - swww
      - wallust
      # Status bar
      - waybar
      # Notifications
      - SwayNotificationCenter
      # App launcher
      - rofi
      # Terminal
      - kitty
      # File manager
      - Thunar
      - thunar-volman
      - thunar-archive-plugin
      - file-roller
      # Bluetooth
      - blueman
      # Network tray
      - network-manager-applet
      # XDG portals (screen sharing, file picker)
      - xdg-desktop-portal-hyprland
      - xdg-desktop-portal-gtk
      # Clipboard
      - wl-clipboard
      - cliphist
      # Polkit auth agent
      - lxqt-policykit
      # Scripting utilities used by hyprland scripts
      - socat
      - jq
      - bc
      - curl
      - wget
      # Screenshots
      - grim
      - slurp
      - swappy
      # Wallpaper effects (ImageMagick) and video wallpapers (ffmpeg, mpv)
      - ImageMagick
      - ffmpeg
      - mpv
      # Monitor layout GUI
      - nwg-displays
      - nwg-look
      # Media / audio controls
      - playerctl
      - brightnessctl
      - pamixer
      # Logitech peripheral manager
      - solaar
      # Build toolchain — cargo for sunsetr, rest needed by hyprpm to compile plugins (e.g. hy3)
      - cargo
      - cmake
      - meson
      - cpio
      - pkg-config
      - gcc
      - gcc-c++
      - aquamarine-devel
      - hyprlang-devel
      - hyprcursor-devel
      - hyprutils-devel
      - hyprgraphics-devel
      - wayland-protocols-devel
      - libdrm-devel
      - libinput-devel
      - re2-devel
      - mesa-libgbm-devel
      - libuuid-devel
      - hyprwayland-scanner-devel
      - xcb-util-wm-devel
      - xcb-util-errors-devel
      - tomlplusplus-devel
    state: present

# Build and install sunsetr (night-time colour temperature, not in Fedora repos)
- name: Create directory for sunsetr source
  file:
    path: "{{ repo_dir }}/InstallRepos/sunsetr"
    state: directory

- name: Clone sunsetr repository
  git:
    repo: https://github.com/psi4j/sunsetr.git
    dest: "{{ repo_dir }}/InstallRepos/sunsetr"
    update: yes

- name: Build sunsetr
  command: cargo build --release
  args:
    chdir: "{{ repo_dir }}/InstallRepos/sunsetr"
    creates: "{{ repo_dir }}/InstallRepos/sunsetr/target/release/sunsetr"
  become: false

- name: Install sunsetr to /usr/local/bin
  become: true
  copy:
    src: "{{ repo_dir }}/InstallRepos/sunsetr/target/release/sunsetr"
    dest: /usr/local/bin/sunsetr
    mode: '0755'
    remote_src: true

# rofi-power-menu is a shell script, not packaged
- name: Download rofi-power-menu
  become: true
  get_url:
    url: https://raw.githubusercontent.com/jluttine/rofi-power-menu/master/rofi-power-menu
    dest: /usr/local/bin/rofi-power-menu
    mode: '0755'

# Systemd user services — service files are already in place via the ~/.config symlink
- name: Reload user-level systemd daemon
  become: false
  shell: systemctl --user daemon-reload
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ uid }}"

- name: Enable and start monitor-watcher service
  become: false
  systemd:
    name: monitor-watcher.service
    enabled: true
    state: started
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ uid }}"

- name: Enable and start waybar service
  become: false
  systemd:
    name: waybar.service
    enabled: true
    state: started
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ uid }}"

# NOTE: hy3 (i3-like tiling plugin) must be installed manually after first login:
#   hyprpm add https://github.com/outfoxxed/hy3
#   hyprpm enable hy3
# hyprpm requires a running Hyprland session, so it cannot run from this playbook.
