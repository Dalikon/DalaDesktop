- hosts: localhost
  connection: local
  vars:
    user: "{{ lookup('env', 'USER') | default(lookup('env', 'LOGNAME')) }}"
    repo_dir: "/home/{{ user }}/DalaDesktop"

    # ── Optional roles ─────────────────────────────────────────────────────
    # Set false on machines where you want to keep an existing login manager
    # (e.g. GNOME on a work laptop)
    install_sddm: true

    # Set true on machines with an NVIDIA GPU
    install_nvidia: false

  pre_tasks:
    - name: Create InstallRepos directory
      file:
        path: "{{ repo_dir }}/InstallRepos"
        state: directory

    - name: Stat ~/.config
      stat:
        path: "/home/{{ user }}/.config"
      register: config_stat

    - name: Backup ~/.config if it is a real directory (not a symlink)
      command: mv /home/{{ user }}/.config /home/{{ user }}/.config-backup-{{ ansible_date_time.epoch }}
      when: config_stat.stat.exists and not config_stat.stat.islnk

    - name: Symlink ~/.config to repo configs
      file:
        src: "{{ repo_dir }}/configs"
        dest: "/home/{{ user }}/.config"
        state: link

    - name: Symlink ~/.bashrc
      file:
        src: "{{ repo_dir }}/CpToHome/.bashrc"
        dest: "/home/{{ user }}/.bashrc"
        state: link
        force: yes

    - name: Symlink ~/.dircolors
      file:
        src: "{{ repo_dir }}/CpToHome/.dircolors"
        dest: "/home/{{ user }}/.dircolors"
        state: link

    - name: Symlink ~/.bash_profile
      file:
        src: "{{ repo_dir }}/CpToHome/.bash_profile"
        dest: "/home/{{ user }}/.bash_profile"
        state: link

    - name: Symlink ~/.gitconfig
      file:
        src: "{{ repo_dir }}/CpToHome/.gitconfig"
        dest: "/home/{{ user }}/.gitconfig"
        state: link

    - name: Ensure ~/.local/bin directory exists
      file:
        path: "/home/{{ user }}/.local/bin"
        state: directory

    - name: Symlink tmux-cht.sh to ~/.local/bin
      file:
        src: "{{ repo_dir }}/CpToHome/.local/bin/tmux-cht.sh"
        dest: "/home/{{ user }}/.local/bin/tmux-cht.sh"
        state: link

    - name: Ensure ~/.ssh directory exists with correct permissions
      file:
        path: "/home/{{ user }}/.ssh"
        state: directory
        mode: '0700'

    - name: Symlink ~/.ssh/config
      file:
        src: "{{ repo_dir }}/CpToHome/.ssh/config"
        dest: "/home/{{ user }}/.ssh/config"
        state: link

    - name: Ensure wallpapers directory exists
      file:
        path: "/home/{{ user }}/Pictures/wallpapers"
        state: directory

    - name: Copy bundled wallpapers
      copy:
        src: "{{ repo_dir }}/Backgrounds/"
        dest: "/home/{{ user }}/Pictures/wallpapers"

    - name: Get UID of target user
      command: id -u {{ user }}
      register: user_uid
      changed_when: false

    - name: Set UID fact
      set_fact:
        uid: "{{ user_uid.stdout }}"

  roles:
    - role: Hyprland
    - role: BasePrograms
    - role: Fonts
    - role: BraveBrowser
    - role: InstallObsidian
    - role: SDDM
      when: install_sddm
    - role: NvidiaDriversFedora
      when: install_nvidia
